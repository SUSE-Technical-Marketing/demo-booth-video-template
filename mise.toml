[tools]
python = "3.13"
node = "24"
bun = "1.3.14"

[tasks.install]
description = "Install the video renderer dependencies"
run = "python -m pip install -r render/requirements.txt"

[tasks.build]
description = "Render a video; pass arguments through to render.py"
depends = ["install"]
run = "python render/render.py"

[tasks.run]
description = "Run the Vue timing editor at http://127.0.0.1:8765"
depends = ["editor:install"]
run = "bun run dev"

[tasks."editor:install"]
description = "Install the Vue editor dependencies from bun.lock"
run = "bun install --frozen-lockfile"

[tasks."editor:build"]
description = "Build the static Vue editor into dist/"
depends = ["editor:install"]
run = "bun run build"

[tasks."editor:test"]
description = "Run Vue editor regression tests"
depends = ["editor:install"]
run = "bun run test"

[tasks.test]
description = "Run editor, layout, timing-file, and renderer checks"
depends = ["install", "editor:install"]
run = [
  "bun run test",
  "bun run build",
  "python tests/check_layout_sync.py",
  "python -m unittest discover -s tests",
  "python -c \"import glob,json; [json.load(open(f)) for f in glob.glob('timings/*.json')]\"",
  "python render/render.py --selftest",
]
