[tools]
python = "3.13"
node = "24"
bun = "1.3.14"

[tasks.install]
description = "Install the video renderer dependencies"
run = "python -m pip install -r render/requirements.txt"

[tasks.build]
description = "Render a project JSON; pass arguments through to render.py"
depends = ["install"]
run = "python render/render.py"

[tasks.run]
description = "Run the Vue timing editor at http://127.0.0.1:8765, with the export service it uses"
depends = ["editor:install", "install"]
run = "python render/server.py & trap 'kill $!' EXIT; bun run dev"

[tasks.serve]
description = "Run only the local export service (http://127.0.0.1:8766)"
depends = ["install"]
run = "python render/server.py"

[tasks."editor:install"]
description = "Install the Vue editor dependencies from bun.lock"
run = "bun install --frozen-lockfile"

[tasks."editor:build"]
description = "Build the static Vue editor into dist/, and the interactive page the Export dialog packs into dist-player/"
depends = ["editor:install"]
run = ["bun run build", "bun run build:player"]

[tasks."editor:test"]
description = "Run Vue editor regression tests"
depends = ["editor:install"]
run = "bun run test"

[tasks.test]
description = "Run editor, layout, timing-file, and renderer checks"
depends = ["install", "editor:install"]
run = [
  "bun run test",
  "bun run build",
  "bun run build:player",
  "python -m unittest discover -s tests",
  "python -c \"import sys,glob;sys.path.insert(0,'render');from project import load_project;[load_project(f) for f in glob.glob('timings/*.json')]\"",
  "python render/render.py --selftest",
]
