[tools]
python = "3.13"

[tasks.install]
description = "Install the video renderer dependencies"
run = "python -m pip install -r render/requirements.txt"

[tasks.build]
description = "Render a video; pass arguments through to render.py"
depends = ["install"]
run = "python render/render.py"

[tasks.run]
description = "Serve the timing editor at http://127.0.0.1:8765"
run = "python -m http.server 8765 --bind 127.0.0.1 --directory docs"

[tasks.test]
description = "Run the layout, timing-file, and renderer checks"
depends = ["install"]
run = [
  "python tests/check_layout_sync.py",
  "python -c \"import glob,json; [json.load(open(f)) for f in glob.glob('timings/*.json')]\"",
  "python render/render.py --selftest",
]
